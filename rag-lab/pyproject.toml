[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rag-lab"
version = "0.1.0"
description = "Learn modern RAG architectures — a tutorial in code."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "typer>=0.12",
    "structlog>=24.0",
    "python-dotenv>=1.0",
    "rich>=13.0",
    "rank-bm25>=0.2",
]

[project.optional-dependencies]
llm = ["litellm>=1.40"]
embeddings = ["sentence-transformers"]
chroma = ["chromadb>=0.5"]
qdrant = ["qdrant-client>=1.9"]
rerank = ["sentence-transformers"]
graph = ["networkx>=3.3"]
eval = ["ragas>=0.1"]
api = ["fastapi>=0.111", "uvicorn[standard]>=0.30"]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "mkdocs-mermaid2-plugin>=1.1",
]
dev = [
    "ruff>=0.4",
    "mypy>=1.10",
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",
    "types-pyyaml>=6.0",
]
all = [
    "rag-lab[llm,embeddings,chroma,qdrant,rerank,graph,eval,api]",
]

[project.scripts]
rag-lab = "rag_lab.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_lab"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.uv]
# torch 2.3+, onnxruntime 1.24+, and numpy 2.0+ dropped macOS Intel (x86_64) support
# or ABI-break with torch 2.2. Pin all three to last compatible versions.
constraint-dependencies = [
    "onnxruntime<1.24",
    "torch<2.3",
    "numpy<2.0",
    "transformers<5.0",        # transformers 5.x requires torch>=2.4
    "sentence-transformers<3.0", # sentence-transformers 3.x pulls transformers 5.x
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --cov=src/rag_lab --cov-report=term-missing"
asyncio_mode = "auto"
